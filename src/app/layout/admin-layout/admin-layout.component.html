
<div dir="rtl" class="min-h-screen bg-canvas">

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside
      class="fixed inset-y-0 right-0 z-40 hidden w-64 flex-col border-l border-line bg-white lg:flex">

      <!-- Logo -->
      <div class="flex h-20 items-center gap-3 border-b border-line px-6">
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand text-white">
          <span class="material-symbols-outlined text-2xl">
            medical_services
          </span>
        </div>

        <div>
          <h1 class="font-heading text-lg font-bold text-ink">
            دليلك الطبي
          </h1>
          <p class="text-xs text-muted">لوحة التحكم</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 space-y-2 overflow-y-auto p-4">

        <p class="mb-3 px-3 text-xs font-bold text-subtle">
          الإدارة
        </p>

        @for (item of navigationItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-brand-soft text-brand font-bold"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-muted transition hover:bg-panel hover:text-brand">

            <span class="material-symbols-outlined text-xl">
              {{ item.icon }}
            </span>

            <span>{{ item.label }}</span>

          </a>
        }

        <div class="my-4 border-t border-line"></div>

        <p class="mb-3 px-3 text-xs font-bold text-subtle">
          عام
        </p>

        <a
          routerLink="/"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-muted transition hover:bg-panel hover:text-brand">

          <span class="material-symbols-outlined text-xl">
            public
          </span>

          <span>عرض الموقع</span>
        </a>

      </nav>

      <!-- Sidebar Footer -->
      <div class="border-t border-line p-4">
        <div class="flex items-center gap-3 rounded-xl bg-panel p-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-soft text-brand">
            <span class="material-symbols-outlined">person</span>
          </div>

          <div class="min-w-0">
            <p class="truncate text-sm font-bold text-ink">
              مدير النظام
            </p>
            <p class="text-xs text-muted">Administrator</p>
          </div>
        </div>
      </div>

    </aside>

    <!-- Main Content -->
    <main class="flex min-w-0 flex-1 flex-col lg:mr-64">

      <!-- Header -->
      <header
        class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-line bg-white/95 px-5 backdrop-blur sm:px-8">

        <div>
          <p class="text-xs text-muted">لوحة التحكم</p>
          <h2 class="font-heading text-base font-bold text-ink">
            إدارة الدليل الطبي
          </h2>
        </div>

        <a
          routerLink="/"
          class="flex items-center gap-2 rounded-xl border border-line px-3 py-2 text-sm text-muted transition hover:border-brand hover:text-brand">

          <span class="material-symbols-outlined text-lg">
            open_in_new
          </span>

          <span class="hidden sm:inline">عرض الموقع</span>
        </a>

      </header>

      <!-- Page Content -->
      <div class="flex-1 p-4 sm:p-6 lg:p-8">
        <router-outlet />
      </div>

    </main>

  </div>

</div>
