
<app-page-hero
  title="المخابر"
  subtitle="ابحث عن مخبر تحاليل في مدينتك، واعرف إن كان مفتوحاً الآن وهل يوفّر سحب العينات من المنزل." />

<section class="py-8 md:py-10">
  <div class="container-page flex flex-col gap-6">
    <app-directory-filters
      [(filters)]="filters"
      label="تصفية المخابر"
      placeholder="اسم المخبر أو المنطقة"
      flagLabel="سحب منزلي" />

    <app-directory-results
      [config]="resultsConfig"
      [loading]="loading()"
      [error]="!!error()"
      [resultCount]="results().length"
      [loadingMore]="loadingMore()"
      [loadMoreError]="loadMoreError()"
      [hasMore]="hasMore()"
      (retry)="retry()"
      (loadMore)="loadMore()">
      <ng-template #cardContent>
        @for (lab of results(); track lab.id) {
          <app-place-card
            [place]="lab"
            icon="biotech"
            [tag]="lab.homeVisit ? 'سحب منزلي' : ''"
            [detailsLink]="'/labs/' + lab.id" />
        }
      </ng-template>
    </app-directory-results>
  </div>
</section>
