
<app-page-hero
  title="الصيدليات"
  subtitle="ابحث عن صيدلية في مدينتك، واعرف إن كانت مفتوحة الآن وهل تعمل على مدار الساعة." />

<section class="py-8 md:py-10">
  <div class="container-page flex flex-col gap-6">
    <app-directory-filters
      [(filters)]="filters"
      label="تصفية الصيدليات"
      placeholder="اسم الصيدلية أو المنطقة"
      flagLabel="24 ساعة" />

    <app-directory-results
      [config]="resultsConfig"
      [loading]="loading()"
      [error]="!!error()"
      [resultCount]="results().length"
      [loadingMore]="loadingMore()"
      [loadMoreError]="loadMoreError()"
      [hasMore]="hasMore()"
      (retry)="retry()"
      (loadMore)="loadMore()">
      <ng-template #cardContent>
        @for (p of results(); track p.id) {
          <app-place-card
            [place]="p"
            icon="local_pharmacy"
            [tag]="is24(p.workingHours) ? '24 ساعة' : ''"
            [detailsLink]="'/pharmacies/' + p.id" />
        }
      </ng-template>
    </app-directory-results>
  </div>
</section>
