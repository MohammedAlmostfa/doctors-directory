<section class="relative overflow-hidden bg-gradient-to-br from-brand-deep via-brand-dark to-brand text-white">
  <!-- دوائر زخرفية خفيفة -->
  <div class="absolute -top-32 -start-32 w-[28rem] h-[28rem] rounded-full bg-white/5" aria-hidden="true"></div>
  <div class="absolute -bottom-40 -end-24 w-[32rem] h-[32rem] rounded-full bg-white/5" aria-hidden="true"></div>

  <div class="container-page relative py-16 md:py-24 text-center">
    <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/20 text-sm">
      <span class="icon text-[18px]" aria-hidden="true">medical_services</span>
      أطباء · صيدليات · مراكز طبية · مخابر
    </span>

    <h1 class="mt-6 text-4xl md:text-5xl lg:text-6xl font-bold leading-tight">
      ابحث عن الطبيب والخدمة الطبية<br class="hidden md:block"> الأقرب إليك
    </h1>
    <p class="mt-5 text-lg text-white/80 max-w-2xl mx-auto">
      العنوان وساعات الدوام ورقم الهاتف، وهل المكان مفتوح الآن، كل ذلك في مكان واحد وبالعربية.
    </p>

    <form role="search" aria-label="البحث عن طبيب"
          class="mt-10 max-w-3xl mx-auto bg-white rounded-2xl p-3 shadow-xl text-ink flex flex-col md:flex-row gap-3"
          (submit)="$event.preventDefault(); search()">

      <div class="relative flex-1">
        <span class="icon text-[20px] text-subtle absolute inset-y-0 start-3.5 flex items-center pointer-events-none" aria-hidden="true">search</span>
        <input type="search" class="field-input field-input-icon !h-12" autocomplete="off"
               placeholder="اسم الطبيب أو التخصص" aria-label="اسم الطبيب أو التخصص"
               [value]="q()" (input)="q.set($any($event.target).value)">
      </div>

      <div class="relative md:w-48">
        <select aria-label="المدينة" class="field-input !h-12 appearance-none cursor-pointer pe-9"
                [value]="city()" (change)="city.set($any($event.target).value)">
          <option value="">كل المدن</option>
          @for (c of cities; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
        <span class="icon text-[18px] text-subtle absolute inset-y-0 end-3 flex items-center pointer-events-none" aria-hidden="true">expand_more</span>
      </div>

      <button type="submit" class="btn-primary !h-12 !px-8">بحث</button>
    </form>

    <div class="mt-6 flex flex-wrap items-center justify-center gap-2 text-sm">
      <span class="text-white/70">ابدأ من تخصص:</span>
      @for (s of quick; track s) {
        <a routerLink="/doctors" [queryParams]="{ specialty: s }"
           class="px-3 py-1 rounded-full border border-white/25 text-white/90 hover:bg-white/10 transition-colors">{{ s }}</a>
      }
    </div>
  </div>
</section>
