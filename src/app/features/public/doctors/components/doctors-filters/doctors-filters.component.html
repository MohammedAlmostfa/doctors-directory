<form class="card p-4 flex flex-wrap items-center gap-3" role="search" aria-label="تصفية الأطباء"
      (submit)="$event.preventDefault()">

  <div class="relative flex-1 min-w-[220px]">
    <span class="icon text-[20px] text-subtle absolute inset-y-0 start-3.5 flex items-center pointer-events-none" aria-hidden="true">search</span>
    <input type="search" class="field-input field-input-icon" placeholder="اسم الطبيب أو التخصص أو المنطقة"
           aria-label="اسم الطبيب أو التخصص أو المنطقة" autocomplete="off"
           [value]="filters().q" (input)="patch({ q: $any($event.target).value })">
  </div>

  <div class="relative w-full sm:w-48">
    <select aria-label="التخصص" class="field-input appearance-none cursor-pointer pe-9"
            [value]="filters().specialty" (change)="patch({ specialty: $any($event.target).value })">
      <option value="">كل التخصصات</option>
      @for (s of specialties; track s) {
        <option [value]="s" [selected]="filters().specialty === s">{{ s }}</option>
      }
    </select>
    <span class="icon text-[18px] text-subtle absolute inset-y-0 end-3 flex items-center pointer-events-none" aria-hidden="true">expand_more</span>
  </div>

  <div class="relative w-full sm:w-48">
    <select aria-label="المحافظة" class="field-input appearance-none cursor-pointer pe-9"
            [value]="filters().governorate" (change)="patch({ governorate: $any($event.target).value })">
      <option value="">كل المحافظات</option>
      @for (c of governorates; track c) {
        <option [value]="c" [selected]="filters().governorate === c">{{ c }}</option>
      }
    </select>
    <span class="icon text-[18px] text-subtle absolute inset-y-0 end-3 flex items-center pointer-events-none" aria-hidden="true">expand_more</span>
  </div>
</form>
