
<app-page-hero
  title="الأطباء"
  subtitle="ابحث عن طبيب حسب الاسم أو التخصص أو المدينة، واطّلع على عنوان عيادته ورقم هاتفه." />

<section class="py-8 md:py-10">
  <div class="container-page flex flex-col gap-6">
    <app-directory-filters
      [(filters)]="filters"
      label="تصفية الأطباء"
      placeholder="اسم الطبيب أو التخصص أو المنطقة"
      [categorySelect]="specialtySelect"
      [showOpenNow]="false" />

    <app-directory-results
      [config]="resultsConfig"
      [loading]="loading()"
      [error]="!!error()"
      [resultCount]="results().length"
      [loadingMore]="loadingMore()"
      [loadMoreError]="loadMoreError()"
      [hasMore]="hasMore()"
      (retry)="retry()"
      (loadMore)="loadMore()">
      <ng-template #cardContent>
        @for (d of results(); track d.id) {
          <app-place-card
            [place]="d"
            icon="medical_services"
            [tag]="d.specialty"
            [detailsLink]="'/doctors/' + d.id">
            @if (d.experienceYears !== null) {
              <div class="mt-4 flex items-start gap-3 text-sm">
                <span
                  class="icon mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-canvas text-lg text-subtle"
                  aria-hidden="true">
                  workspace_premium
                </span>

                <div class="min-w-0 flex-1">
                  <span class="mb-1 block text-xs font-medium text-subtle">
                    الخبرة المهنية
                  </span>

                  <p class="font-semibold text-ink">
                    {{ d.experienceYears }} سنة
                  </p>
                </div>
              </div>
            }
          </app-place-card>
        }
      </ng-template>
    </app-directory-results>
  </div>
</section>
