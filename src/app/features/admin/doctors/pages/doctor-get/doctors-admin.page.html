
<app-admin-page-layout
  title="إدارة الأطباء"
  description="إدارة بيانات الأطباء وإضافة وتعديل وحذف السجلات.">
  <button
    admin-action
    type="button"
    class="inline-flex items-center justify-center gap-2 rounded-xl bg-brand px-5 py-3 text-sm font-semibold text-white transition hover:bg-brand-dark"
    (click)="addDoctor()">
    <span class="material-symbols-outlined text-xl" aria-hidden="true">add</span>
    إضافة طبيب
  </button>

  <app-admin-stat-card admin-stat title="إجمالي الأطباء" [value]="pagination()?.total ?? 0" />
  <app-admin-stat-card admin-stat title="الصفحة الحالية" [value]="pagination()?.current_page ?? 0" />
  <app-admin-stat-card admin-stat title="إجمالي الصفحات" [value]="pagination()?.last_page ?? 0" />

  <app-admin-search
    admin-filter
    id="doctor-search"
    label="البحث عن طبيب"
    placeholder="ابحث بالاسم أو التخصص أو المنطقة..."
    [value]="search()"
    (valueChange)="search.set($event)" />

  @if (error(); as message) {
    <app-admin-error-alert admin-error [message]="message" (retry)="retry()" />
  }

  <div class="overflow-hidden rounded-2xl border border-line bg-white">
    <div class="border-b border-line px-5 py-4">
      <h2 class="font-heading font-bold text-ink">
        قائمة الأطباء
      </h2>

      <p class="mt-1 text-xs text-muted">
        {{ results().length }} نتيجة في الصفحة الحالية
      </p>
    </div>

    <app-data-table
      [columns]="columns"
      [data]="results()"
      [loading]="loading()"
      emptyTitle="لا يوجد أطباء"
      emptyMessage="لم يتم العثور على أطباء مطابقين للبحث."
      (edit)="editDoctor($event)"
      (delete)="deleteDoctor($event)" />

    @if (pagination() && !search()) {
      <app-data-pagination
        [meta]="pagination()!"
        [disabled]="loading()"
        (pageChange)="changePage($event)" />
    }
  </div>
</app-admin-page-layout>
