
<app-admin-page-layout
  title="إدارة الصيدليات"
  description="إدارة بيانات الصيدليات ومعلومات التواصل والموقع.">
  <app-admin-stat-card admin-stat title="إجمالي الصيدليات" [value]="pagination()?.total ?? 0" />
  <app-admin-stat-card admin-stat title="الصفحة الحالية" [value]="pagination()?.current_page ?? 0" />
  <app-admin-stat-card admin-stat title="إجمالي الصفحات" [value]="pagination()?.last_page ?? 0" />

  <app-admin-search
    admin-filter
    id="pharmacy-search"
    label="البحث عن صيدلية"
    placeholder="ابحث بالاسم أو المحافظة أو المنطقة أو الهاتف..."
    [value]="search()"
    (valueChange)="search.set($event)" />

  @if (error(); as message) {
    <app-admin-error-alert admin-error [message]="message" (retry)="retry()" />
  }

  <div class="overflow-hidden rounded-2xl border border-line bg-white">
    <div class="border-b border-line px-5 py-4">
      <h2 class="font-heading font-bold text-ink">
        قائمة الصيدليات
      </h2>

      <p class="mt-1 text-xs text-muted">
        {{ results().length }} نتيجة في الصفحة الحالية
      </p>
    </div>

    <app-data-table
      [columns]="columns"
      [data]="results()"
      [loading]="loading()"
      [showActions]="false"
      emptyTitle="لا توجد صيدليات"
      emptyMessage="لم يتم العثور على صيدليات مطابقة للبحث."
    />

    @if (pagination() && !search()) {
      <app-data-pagination
        [meta]="pagination()!"
        [disabled]="loading()"
        (pageChange)="changePage($event)" />
    }
  </div>
</app-admin-page-layout>
