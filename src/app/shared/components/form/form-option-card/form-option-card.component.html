<label
  class="flex cursor-pointer items-start gap-3 rounded-lg border border-line bg-white p-4 transition-colors hover:border-line-strong"
  [class.border-brand]="checked()"
  [class.bg-brand-soft]="checked()"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-60]="disabled()"
>
  <input
    type="radio"
    [name]="name()"
    [value]="value()"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="selected.emit(value())"
    class="mt-1 h-4 w-4 accent-brand"
  />

  <div class="min-w-0 flex-1">
    <p class="text-sm font-semibold text-ink">
      {{ title() }}
    </p>

    @if (description()) {
      <p class="mt-1 text-xs leading-5 text-subtle">
        {{ description() }}
      </p>
    }
  </div>
</label>
