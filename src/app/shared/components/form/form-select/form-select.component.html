<div class="space-y-1.5">
  <label
    [for]="id()"
    class="block text-sm font-semibold text-ink"
  >
    {{ label() }}

    @if (required()) {
      <span class="text-red-500">*</span>
    }
  </label>

  <div class="relative">
    <select
      [id]="id()"
      [value]="value ?? ''"
      [disabled]="disabled"
      [required]="required()"
      [attr.aria-invalid]="invalid"
      [attr.aria-describedby]="invalid ? id() + '-error' : null"
      (change)="onSelect($event)"
      (blur)="onBlur()"
      class="h-11 w-full appearance-none rounded-md border border-line-strong bg-white px-3.5 pe-10 text-sm text-ink outline-none transition-colors focus:border-brand focus:ring-1 focus:ring-brand disabled:bg-canvas"
    >
      <option value="" disabled>
        {{ placeholder() }}
      </option>

      @for (option of options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled ?? false"
        >
          {{ option.label }}
        </option>
      }
    </select>

    <span
      class="icon pointer-events-none absolute end-3 top-1/2 -translate-y-1/2 text-subtle"
    >
      expand_more
    </span>
  </div>

  <app-form-error
    [control]="ngControl?.control ?? null"
    [id]="id() + '-error'"
  />
</div>
