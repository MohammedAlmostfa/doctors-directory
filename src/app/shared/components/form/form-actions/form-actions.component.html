<div
  class="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-white px-4 py-4 shadow-lg md:px-8"
>
  <div
    class="mx-auto flex max-w-[880px] flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between"
  >
    <button
      type="button"
      (click)="cancel.emit()"
      [disabled]="saving()"
      class="inline-flex h-11 items-center justify-center rounded-lg border border-line-strong bg-white px-6 text-sm font-medium text-ink transition-colors hover:border-brand hover:bg-brand-soft hover:text-brand disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ cancelLabel() }}
    </button>

    <button
      type="button"
      (click)="save.emit()"
      [disabled]="disabled() || saving()"
      class="inline-flex h-11 items-center justify-center gap-2 rounded-lg bg-brand px-8 text-sm font-medium text-white transition-colors hover:bg-brand-dark disabled:cursor-not-allowed disabled:opacity-50"
    >
      @if (saving()) {
        <span class="icon animate-spin">progress_activity</span>
        جارٍ الحفظ...
      } @else {
        <span class="icon">save</span>
        {{ saveLabel() }}
      }
    </button>
  </div>
</div>
