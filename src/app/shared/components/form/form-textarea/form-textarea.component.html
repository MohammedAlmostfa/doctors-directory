<div class="space-y-1.5">
  <label
    [for]="id()"
    class="block text-sm font-semibold text-ink"
  >
    {{ label() }}

    @if (required()) {
      <span class="text-red-500">*</span>
    }
  </label>

  <textarea
    [id]="id()"
    [value]="value"
    [rows]="rows()"
    [attr.maxlength]="maxLength()"
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [required]="required()"
    [attr.aria-invalid]="invalid"
    [attr.aria-describedby]="
      invalid
        ? id() + '-error'
        : hint()
          ? id() + '-hint'
          : null
    "
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="w-full resize-y rounded-md border border-line-strong bg-white px-3.5 py-3 text-sm text-ink outline-none transition-colors placeholder:text-subtle focus:border-brand focus:ring-1 focus:ring-brand disabled:bg-canvas"
  ></textarea>

  <div class="flex items-center justify-between gap-3">
    @if (hint() && !invalid) {
      <p [id]="id() + '-hint'" class="text-xs text-subtle">
        {{ hint() }}
      </p>
    } @else {
      <span></span>
    }

    @if (maxLength()) {
      <span class="text-xs text-subtle" dir="ltr">
        {{ value.length }} / {{ maxLength() }}
      </span>
    }
  </div>

  <app-form-error
    [control]="ngControl?.control ?? null"
    [id]="id() + '-error'"
  />
</div>
